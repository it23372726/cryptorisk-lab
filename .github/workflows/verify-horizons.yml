name: Generate audited five-horizon Bitcoin forecasts

on:
  push:
    branches: [research-web-v5-multi-horizon-7-14-30-60-90]
    paths:
      - 'research/phase5_horizons/generate.py'
      - 'research/phase5_horizons/verify_horizons.py'
      - 'research/phase5_horizons/EXPLORATORY_PROTOCOL.md'
      - '.github/workflows/verify-horizons.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/phase5_horizons/**'
      - 'docs/v5-evidence-horizons.js'
      - '.github/workflows/verify-horizons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  horizons:
    name: Reproduce 5 horizons against archived Binance daily closes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install reproducible scientific libraries
        run: python -m pip install -r research/phase3_2026/requirements-lock.txt
      - name: Freeze and compute all five horizon forecast series
        run: python research/phase5_horizons/generate.py
      - name: Independently verify original 30-day findings and all horizon scores
        run: python research/phase5_horizons/verify_horizons.py
      - name: Upload dated horizon evidence and results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: five-horizon-2025-2026-scientific-evidence
          path: |
            docs/v5-evidence-horizons.js
            research/phase5_horizons/results/
          if-no-files-found: error
      - name: Commit first audited evidence onto isolated research branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/research-web-v5-multi-horizon-7-14-30-60-90'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v5-evidence-horizons.js research/phase5_horizons/results/
          if ! git diff --cached --quiet; then
            git commit -m 'Archive five-horizon verified BTC forecasts and descriptive validation'
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            git push origin HEAD:${{ github.ref_name }}
          fi
