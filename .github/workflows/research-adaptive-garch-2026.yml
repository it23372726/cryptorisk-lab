name: Frozen 2026 research - adaptive GBM and GARCH

on:
  push:
    branches: [research-adaptive-gbm-garch-2026-holdout]
    paths:
      - 'research/phase3_2026/PRE_REGISTERED_PROTOCOL.md'
      - 'research/phase3_2026/run_research.py'
      - 'research/phase3_2026/check_results.py'
      - '.github/workflows/research-adaptive-garch-2026.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  2026-holdout:
    name: Verify and execute frozen 2026 model comparison
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned GARCH and original scientific dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'arch==7.2.0'
          python -c "import arch; assert arch.__version__ == '7.2.0'"
      - name: Compile and run deterministic model self-tests without holdout data
        run: |
          python -m py_compile research/phase3_2026/run_research.py research/phase3_2026/check_results.py
          python research/phase3_2026/run_research.py --self-test
      - name: Execute frozen 2026 holdout research without model retuning
        run: python research/phase3_2026/run_research.py --run
      - name: Independently recompute and audit saved model scores and dates
        run: python research/phase3_2026/check_results.py
      - name: Upload verified research reports and official source hashes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frozen-2026-adaptive-gbm-garch-research
          path: research/phase3_2026/results/
          if-no-files-found: error
      - name: Commit exact, verified research outputs to the isolated research branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/research-adaptive-gbm-garch-2026-holdout'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/phase3_2026/results/
          if ! git diff --cached --quiet; then
            git commit -m 'Record frozen 2026 adaptive volatility holdout results and source provenance'
            git push origin HEAD:${{ github.ref_name }}
          fi
