name: Verify CryptoRisk Lab scientific website

on:
  push:
    branches: [research-web-v2-2026-11-23, phase1-research-ewma-2026-11-23, website-v2-animated-lab-2026-11-23, historical-validation-lab-2026-11-23, website-v3-five-model-2026-validation-2026-11-24]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook:
    name: Run scientific notebook
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nbclient nbformat ipykernel
      - name: Execute all notebook cells and verify research extensions
        env:
          MPLBACKEND: Agg
        run: python scripts/verify_notebook.py
      - name: Upload historical evidence and notebook verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-2025-per-origin-forecast-data
          path: |
            docs/v2-validation-data.js
            docs/v2-validation-data.json
            verification-results.json
          if-no-files-found: error
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-verification
          path: verification-results.json
          if-no-files-found: ignore

  browser:
    name: Exercise interactive dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check 2026 standalone evidence reproduces frozen research ledger
        run: python scripts/verify_v3_evidence.py
      - name: Check exploratory 2025 five-model dataset preserves original notebook
        run: python research/phase4_2025/verify_extension.py
      - name: Recompute parity for all ten historical year/horizon evidence tables
        run: python research/phase5_horizons/verify_horizons.py
      - name: Stress-test 30,000 paths per model at 90-day horizon
        run: node --max-old-space-size=4096 scripts/verify_v3_models.cjs
      - name: Run end-to-end Chromium checks
        run: python scripts/verify_browser.py
      - name: Upload standalone local preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: website-v5-five-horizon-standalone-preview
          path: docs/
          if-no-files-found: error
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            browser-verification.png
            browser-verification-full-year.png
            browser-verification-crosshair.png
            browser-verification-predictions-reality.png
            browser-verification-validation-replay.png
            browser-verification-2026.png
            browser-verification-2026-overview.png
            browser-verification-selector-2025.png
            browser-verification-selector-2026.png
            browser-verification-unified-2025.png
            browser-verification-2025-h7.png
            browser-verification-2026-h90.png
            browser-verification-unified-2026.png
            browser-verification-unified-replay.png
            browser-verification-2026-replay.png
            browser-verification-mobile.png
          if-no-files-found: ignore
