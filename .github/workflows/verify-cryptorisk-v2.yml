name: Verify CryptoRisk Lab v2

on:
  push:
    branches: [research-web-v2-2026-11-23, phase1-research-ewma-2026-11-23, website-v2-animated-lab-2026-11-23, historical-validation-lab-2026-11-23]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook:
    name: Run scientific notebook
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install scientific dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nbclient nbformat ipykernel
      - name: Execute all notebook cells and verify research extensions
        env:
          MPLBACKEND: Agg
        run: python scripts/verify_notebook.py
      - name: Commit 335 verified historical forecast origins to feature branch
        if: (github.event_name == 'push' && github.ref == 'refs/heads/historical-validation-lab-2026-11-23') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'historical-validation-lab-2026-11-23')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v2-validation-data.js docs/v2-validation-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Bundle notebook-verified 335 historic 2025 prediction outcomes'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - name: Upload historical evidence and notebook verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-2025-per-origin-forecast-data
          path: |
            docs/v2-validation-data.js
            docs/v2-validation-data.json
            verification-results.json
          if-no-files-found: error
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-verification
          path: verification-results.json
          if-no-files-found: ignore

  browser:
    name: Exercise interactive dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run end-to-end Chromium checks
        run: python scripts/verify_browser.py
      - name: Upload standalone local preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: website-v2-standalone-preview
          path: docs/
          if-no-files-found: error
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: |
            browser-verification.png
            browser-verification-full-year.png
            browser-verification-crosshair.png
            browser-verification-predictions-reality.png
            browser-verification-mobile.png
          if-no-files-found: ignore
