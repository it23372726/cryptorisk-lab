name: Export exploratory 2025 five-model probabilities

on:
  push:
    branches: [research-web-2025-five-model-exploratory-2026-11-24]
    paths:
      - 'research/phase4_2025/EXPLORATORY_PROTOCOL.md'
      - 'research/phase4_2025/build_exploratory.py'
      - '.github/workflows/export-2025-adaptive-garch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-candidates:
    name: Generate and audit 335 historical Adaptive GBM/GARCH forecasts
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical dependency
        run: python -m pip install 'numpy==1.26.4'
      - name: Generate new candidate predictions and independently audit states and scores
        run: |
          python research/phase4_2025/build_exploratory.py --generate
          python research/phase4_2025/build_exploratory.py --verify
      - name: Upload all exploratory evidence and research interpretation
        uses: actions/upload-artifact@v4
        with:
          name: exploratory-2025-adaptive-gbm-garch
          path: |
            docs/v4-exploratory-2025-data.json
            docs/v4-exploratory-2025-data.js
            research/phase4_2025/FINDINGS.md
          if-no-files-found: error
      - name: Commit source-verified scientific results on isolated research branch
        if: success() && github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/v4-exploratory-2025-data.json docs/v4-exploratory-2025-data.js research/phase4_2025/FINDINGS.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record audited 2025 exploratory Adaptive GBM and GARCH forecasts'
            git push origin HEAD:${{ github.ref_name }}
          fi
